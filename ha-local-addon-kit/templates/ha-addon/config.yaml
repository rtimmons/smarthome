name: "TODO_APP_NAME"
version: "0.1.0"
slug: "TODO_ADDON_SLUG"
description: "TODO_SHORT_DESCRIPTION"
url: "TODO_REPOSITORY_URL"
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
watchdog: tcp://[HOST]:[PORT:3000]

# Enable ingress for browser-based apps so the app can appear in the Home Assistant sidebar.
ingress: true
ingress_port: 3000
ingress_entry: "/"
panel_icon: "mdi:web"
panel_title: "TODO_PANEL_TITLE"

# Keep permissions minimal. Add HA API access only if the app calls Home Assistant.
homeassistant_api: false
auth_api: false

# Optional direct LAN access. Set the host value to null to disable direct exposure.
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: "TODO_APP_NAME web UI"

# /data is the add-on's persistent data directory and is managed by Supervisor.
map:
  - type: data
    read_only: false

environment:
  NODE_ENV: "production"
  DATA_DIR: "/data"

options:
  port: 3000
  public_base_url: ""

schema:
  port: "int"
  public_base_url: "str?"
