- id: closet_presence_lighting
  alias: "Closet Presence Lighting"
  description: "Automatically control closet lighting based on human presence detection"
  triggers:
    - trigger: state
      entity_id: binary_sensor.human_sensor_presence
      from: "off"
      to: "on"
  conditions:
    - condition: state
      entity_id: light.light_closet_main
      state: "off"
  actions:
    - alias: "Turn on closet light at 10% brightness when entering"
      action: light.turn_on
      target:
        entity_id: light.light_closet_main
      data:
        brightness_pct: 10
    - alias: "Wait until no presence detected for 37.5 seconds"
      wait_for_trigger:
        - trigger: state
          entity_id: binary_sensor.human_sensor_presence
          to: "off"
          for:
            seconds: 37
            milliseconds: 500
    - alias: "Turn off closet scene after timeout"
      action: script.fast_scene_closet_off
  mode: single

- id: zwave_controller_jammed_alert
  alias: Z-Wave Controller Jammed Alert
  description: Preserve a visible alert whenever the ZWA-2 reports a jammed network.
  triggers:
    - trigger: state
      entity_id: sensor.home_assistant_connect_zwa_2_status
      to: jammed
  actions:
    - action: persistent_notification.create
      data:
        notification_id: zwave_controller_jammed
        title: Z-Wave controller jammed
        message: >-
          The ZWA-2 reported a jammed network at {{ now().strftime('%Y-%m-%d %H:%M:%S %Z') }}.
          Review the Z-Wave JS file log before restarting anything.
  mode: single

- id: zwave_dead_nodes_alert
  alias: Z-Wave Dead Nodes Alert
  description: Alert when one or more Z-Wave nodes stay dead for five minutes.
  triggers:
    - trigger: template
      value_template: >-
        {% set ns = namespace(nodes=[]) %}
        {% for item in states.sensor
           if item.entity_id.endswith('_node_status') and item.state == 'dead' %}
          {% set ns.nodes = ns.nodes + [item.entity_id] %}
        {% endfor %}
        {{ ns.nodes | count > 0 }}
      for: "00:05:00"
  actions:
    - action: persistent_notification.create
      data:
        notification_id: zwave_dead_nodes
        title: Z-Wave nodes remain dead
        message: >-
          {% set ns = namespace(nodes=[]) %}
          {% for item in states.sensor
             if item.entity_id.endswith('_node_status') and item.state == 'dead' %}
            {% set ns.nodes = ns.nodes + [item.name] %}
          {% endfor %}
          Dead for at least five minutes: {{ ns.nodes | join(', ') }}.
  mode: single

- id: zwave_dead_nodes_alert_clear
  alias: Z-Wave Dead Nodes Alert Clear
  description: Dismiss the dead-node alert after every node recovers.
  triggers:
    - trigger: template
      value_template: >-
        {% set ns = namespace(count=0) %}
        {% for item in states.sensor
           if item.entity_id.endswith('_node_status') and item.state == 'dead' %}
          {% set ns.count = ns.count + 1 %}
        {% endfor %}
        {{ ns.count == 0 }}
  actions:
    - action: persistent_notification.dismiss
      data:
        notification_id: zwave_dead_nodes
  mode: single

- id: fast_scene_skipped_targets_alert
  alias: Fast Scene Skipped Targets Alert
  description: Report targets that a best-effort scene skipped because they were unavailable or on an unhealthy Z-Wave node.
  triggers:
    - trigger: event
      event_type: fast_scene_targets_skipped
  actions:
    - action: persistent_notification.create
      data:
        notification_id: fast_scene_skipped_targets
        title: Scene skipped unhealthy targets
        message: >-
          {{ trigger.event.data.scene_id }} skipped
          {{ trigger.event.data.entity_ids | join(', ') }} at
          {{ now().strftime('%Y-%m-%d %H:%M:%S %Z') }}.
          The remaining healthy scene targets are still being dispatched.
  mode: queued
  max: 5

