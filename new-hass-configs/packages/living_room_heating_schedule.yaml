automation:
  - id: living_room_heating_schedule
    alias: Living Room Heating Schedule
    description: >-
      Set the living-room Nest to 73 °F from 08:00 to 22:00 and 72 °F
      overnight, using Home Assistant's local time.
    triggers:
      - trigger: time
        at: "08:00:00"
      - trigger: time
        at: "22:00:00"
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: climate.living_room
        from: ["off", "cool", "heat_cool", "unavailable", "unknown"]
        to: "heat"
      - trigger: state
        entity_id: automation.living_room_heating_schedule
        from: "off"
        to: "on"
    actions:
      - variables:
          scheduled_temperature: "{{ 73 if 8 <= now().hour < 22 else 72 }}"
      - condition: state
        entity_id: climate.living_room
        state: "heat"
      - condition: template
        value_template: >-
          {{ state_attr('climate.living_room', 'temperature') | float(none)
             != scheduled_temperature }}
      - action: climate.set_temperature
        target:
          entity_id: climate.living_room
        data:
          temperature: "{{ scheduled_temperature }}"
    mode: queued
    max: 5
