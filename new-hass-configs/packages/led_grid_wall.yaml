# Native integration compatibility and generated fast-scene controls.
script:
  led_grid_wall_apply:
    alias: LED Grid Wall - Apply observed controls
    description: Apply guarded native LED wall controls and return success/error. Omitted fields are preserved;
      zero brightness may retain playback.
    mode: parallel
    max: 10
    max_exceeded: error
    fields:
      brightness:
        description: Master output brightness, 0..255; 26 is approximately 10 percent.
        selector:
          number:
            min: 0
            max: 255
            step: 1
      power:
        description: Start or stop the retained Scene.
        selector:
          boolean: null
      multiplier:
        description: Operator pace multiplier; 1x equals controller speed scale 0.3.
        selector:
          number:
            min: 0.1
            max: 25
            step: 0.05
    sequence:
      - if: >-
          {{ (brightness is defined and (brightness is not integer or brightness is boolean
              or brightness < 0 or brightness > 255))
             or (power is defined and power is not boolean)
             or (multiplier is defined and (multiplier is not number or multiplier is boolean
                 or not (0.1 <= multiplier <= 25)))
             or (brightness is not defined and power is not defined and multiplier is not defined) }}
        then:
          - variables:
              result:
                success: false
                error: Invalid wall controls; brightness is 0..255, power is boolean, pace is 0.1..25x.
          - stop: Invalid wall controls.
            response_variable: result
      - action: led_grid_wall.apply
        data: >-
          {% set fields = namespace(value={'entity_id': 'light.led_grid_wall'}) %}
          {% if brightness is defined %}{% set fields.value = dict(fields.value, brightness=brightness) %}{% endif %}
          {% if power is defined %}{% set fields.value = dict(fields.value, power=power) %}{% endif %}
          {% if multiplier is defined %}{% set fields.value = dict(fields.value, multiplier=multiplier) %}{% endif %}
          {{ fields.value }}
        response_variable: result
      - stop: Wall apply completed.
        response_variable: result

  led_grid_wall_scene:
    alias: LED Grid Wall - Apply fast scene
    description: >-
      Apply one current room intent. Off sets exact zero output and preserves
      playback; an omitted animation preserves the current selection. Never retry.
    mode: parallel
    max: 10
    sequence:
      - condition: template
        value_template: "{{ states(intent_helper) == intent_token }}"
      - if: "{{ animation is defined and state_attr('select.led_grid_wall_animation', 'content_id') != animation }}"
        then:
          - action: led_grid_wall.play_content
            target:
              entity_id: light.led_grid_wall
            data:
              content_id: "{{ animation }}"
            response_variable: content_result
          - if: "{{ not content_result.get('success', false) }}"
            then:
              - stop: "{{ content_result.get('error', 'Wall animation was not confirmed') }}"
                error: true
          - if: >-
              {{ state_attr('sensor.led_grid_wall_observation', 'controller_session_id') != content_result.controller_session_id
                 or state_attr('sensor.led_grid_wall_observation', 'controller_state_revision') != content_result.controller_state_revision }}
            then:
              - stop: Wall changed after animation selection; remaining controls were not sent.
                error: true
      - condition: template
        value_template: "{{ states(intent_helper) == intent_token }}"
      - action: led_grid_wall.apply
        target:
          entity_id: light.led_grid_wall
        data: >-
          {{ dict(brightness=brightness, power=power) if power is defined
             else dict(brightness=brightness) }}
        response_variable: result
      - if: "{{ not result.get('success', false) }}"
        then:
          - stop: "{{ result.get('error', 'Wall brightness was not confirmed') }}"
            error: true
