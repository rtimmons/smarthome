[project]
name = "printer"
version = "0.1.0"
description = "Kitchen label printing service."
requires-python = ">=3.14"
dependencies = [
    "flask",
    "pillow>=12,<13",
    "brother-ql",
    "python-escpos",
    "cairosvg",
    "qrcode",
    "pymongo",
]

[project.optional-dependencies]
test = [
    "pytest",
    "playwright",
    "pytest-playwright",
]

[project.scripts]
printer-service = "printer_service.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.pytest.ini_options]
markers = ["ui: browser-driven UI tests (Playwright)"]

[tool.hatch.build.targets.wheel]
packages = ["src/printer_service"]
include = [
    "src/printer_service/templates/**",
    "src/printer_service/static/**",
    "src/printer_service/label_templates/**",
]

[dependency-groups]
build = [
    "hatch-requirements-txt==0.4.1",
    "hatchling==1.32.0",
    "setuptools==83.0.0",
    "wheel==0.47.0",
]
