<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" role="img" aria-labelledby="title desc">
  <title id="title">Native requests, canonical storage and optional NAS copies</title>
  <desc id="desc">Seerr provides discovery and requests. Radarr and Sonarr search through Prowlarr and send selected downloads directly to SAB. Eweka supplies the articles. Arr imports completed media into the Storage Box. Both Plex Remote and optional verified NAS copies read from the Storage Box; Plex NAS reads the local copy. Filex staging is separate.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#a9e5c7"/></marker>
    <style>
      .bg{fill:#142d27}.box{fill:#fffdf7}.muted{fill:#b8cdc5}.ink{fill:#172522}.mint{fill:#a9e5c7}.label{font:700 13px system-ui,sans-serif;letter-spacing:1.5px}.title{font:700 22px system-ui,sans-serif}.small{font:500 15px system-ui,sans-serif}.tiny{font:500 13px system-ui,sans-serif}.flow{fill:none;stroke:#a9e5c7;stroke-width:3;marker-end:url(#arrow)}.search{stroke-dasharray:7 7;marker-start:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="960" height="790" rx="18"/>
  <text x="42" y="42" class="label mint">REQUEST → DOWNLOAD → IMPORT</text>
  <text x="580" y="42" class="label mint">INDEXERS · PROVIDER · STORAGE</text>

  <rect x="42" y="68" width="400" height="110" rx="14" class="box"/>
  <text x="68" y="104" class="title ink">Seerr → Radarr / Sonarr</text>
  <text x="68" y="131" class="small ink">Browse popular titles · request a movie or season</text>
  <text x="68" y="155" class="tiny ink">Explicit searches · automatic polling off</text>
  <rect x="580" y="68" width="338" height="110" rx="14" class="box"/>
  <text x="604" y="104" class="title ink">Prowlarr + indexers</text>
  <text x="604" y="131" class="small ink">NZBGeek · NZBFinder</text>
  <text x="604" y="155" class="tiny ink">Indexer access · direct downloads off</text>
  <path d="M446 122H574" class="flow search"/>
  <text x="473" y="107" class="tiny muted">search</text>
  <text x="473" y="145" class="tiny muted">results</text>

  <path d="M242 178v52" class="flow"/>
  <text x="261" y="210" class="tiny muted">Arr sends its selected job</text>
  <rect x="42" y="236" width="400" height="110" rx="14" class="box"/>
  <text x="68" y="272" class="title ink">SABnzbd</text>
  <text x="68" y="299" class="small ink">Download · repair · unpack</text>
  <text x="68" y="323" class="tiny ink">300 GB repair volume · 100 GiB release limit</text>
  <rect x="580" y="236" width="338" height="110" rx="14" class="box"/>
  <text x="604" y="272" class="title ink">Eweka</text>
  <text x="604" y="299" class="small ink">Usenet article provider</text>
  <text x="604" y="323" class="tiny ink">Supplies the pieces SAB assembles</text>
  <path d="M574 290H448" class="flow"/>
  <text x="472" y="276" class="tiny muted">articles</text>

  <path d="M242 346v52" class="flow"/>
  <text x="261" y="378" class="tiny muted">Completed files ready for import</text>
  <rect x="42" y="404" width="400" height="110" rx="14" class="box"/>
  <text x="68" y="440" class="title ink">Arr import + cleanup</text>
  <text x="68" y="467" class="small ink">Each app owns its completed source</text>
  <text x="68" y="491" class="tiny ink">SAB and Arr keep 30 GiB free-space reserves</text>
  <rect x="580" y="404" width="338" height="110" rx="14" class="box"/>
  <text x="604" y="440" class="title ink">Storage Box · 5 TiB</text>
  <text x="604" y="467" class="small ink">Canonical Movies + TV</text>
  <text x="604" y="491" class="tiny ink">Completed staging stays outside libraries</text>
  <path d="M446 458H574" class="flow"/>
  <text x="470" y="443" class="tiny muted">import</text>

  <path d="M750 514v104" class="flow"/>
  <text x="767" y="578" class="tiny muted">read-only</text>
  <path d="M750 550H242v68" class="flow"/>
  <text x="274" y="575" class="tiny muted">Selected, verified copy from Storage Box</text>
  <rect x="42" y="624" width="400" height="100" rx="14" class="box"/>
  <text x="68" y="660" class="title ink">NAS copy → Plex NAS</text>
  <text x="68" y="688" class="small ink">Optional local copy · separate libraries</text>
  <rect x="580" y="624" width="338" height="100" rx="14" class="box"/>
  <text x="604" y="660" class="title ink">Plex Remote</text>
  <text x="604" y="688" class="small ink">Reads through the NAS remote mount</text>
  <text x="42" y="759" class="tiny muted">Filex manages separate staging areas. It cannot modify canonical media or active downloads.</text>
</svg>
