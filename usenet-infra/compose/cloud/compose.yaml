name: usenet-cloud

services:
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:5.1.3-ls272
    environment:
      PUID: "${PUID:?Set PUID in .env}"
      PGID: "${PGID:?Set PGID in .env}"
      TZ: "${TZ:?Set TZ in .env}"
    volumes:
      - type: bind
        source: /srv/usenet/config/sabnzbd
        target: /config
      - type: bind
        source: /srv/usenet/downloads/incomplete
        target: /data/incomplete
      - type: bind
        source: /srv/usenet/downloads/complete
        target: /data/complete
    ports:
      - "127.0.0.1:${SABNZBD_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS 'http://127.0.0.1:8080/api?mode=version' >/dev/null || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.5.2.5491-ls158
    environment:
      PUID: "${PUID:?Set PUID in .env}"
      PGID: "${PGID:?Set PGID in .env}"
      TZ: "${TZ:?Set TZ in .env}"
    volumes:
      - type: bind
        source: /srv/usenet/config/prowlarr
        target: /config
    ports:
      - "127.0.0.1:${PROWLARR_PORT:-9696}:9696"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:9696/ping >/dev/null || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
