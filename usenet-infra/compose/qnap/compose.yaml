name: usenet-cache

services:
  rclone:
    image: rclone/rclone:1.75.1
    user: "${QNAP_UID:?Set QNAP_UID to the dedicated NAS user's numeric UID}:${QNAP_GID:?Set QNAP_GID to the dedicated NAS user's numeric GID}"
    working_dir: /data
    read_only: true
    restart: unless-stopped
    command:
      - rcd
      - --rc-addr=127.0.0.1:5572
      - --rc-no-auth
    environment:
      HOME: /tmp/rclone-home
      TZ: "${TZ:-UTC}"
      XDG_CACHE_HOME: /tmp/rclone-cache
      XDG_CONFIG_HOME: /tmp/rclone-config

      # The direct remote is intentionally kept behind the client-side read-only
      # union below. Hetzner's read-only subaccount is the authoritative control.
      RCLONE_CONFIG_STORAGEBOX_TYPE: sftp
      RCLONE_CONFIG_STORAGEBOX_HOST: "${STORAGEBOX_HOST:?Set STORAGEBOX_HOST to the subaccount hostname}"
      RCLONE_CONFIG_STORAGEBOX_USER: "${STORAGEBOX_USER:?Set STORAGEBOX_USER to the read-only subaccount username}"
      RCLONE_CONFIG_STORAGEBOX_PORT: "${STORAGEBOX_PORT:-23}"
      RCLONE_CONFIG_STORAGEBOX_KEY_FILE: /run/secrets/storagebox_key
      RCLONE_CONFIG_STORAGEBOX_KNOWN_HOSTS_FILE: /run/secrets/storagebox_known_hosts
      RCLONE_CONFIG_STORAGEBOX_SHELL_TYPE: "${STORAGEBOX_SHELL_TYPE:-unix}"
      RCLONE_CONFIG_STORAGEBOX_HASHES: "${STORAGEBOX_HASHES:-sha256}"
      RCLONE_CONFIG_STORAGEBOX_SHA256SUM_COMMAND: "${STORAGEBOX_SHA256SUM_COMMAND:-sha256sum}"
      RCLONE_CONFIG_STORAGEBOX_SKIP_LINKS: "true"
      RCLONE_CONFIG_STORAGEBOX_CHUNK_SIZE: "${RCLONE_SFTP_CHUNK_SIZE:-32Ki}"
      RCLONE_CONFIG_STORAGEBOX_CONCURRENCY: "${RCLONE_SFTP_CONCURRENCY:-64}"

      RCLONE_CONFIG_CATALOG_TYPE: union
      RCLONE_CONFIG_CATALOG_UPSTREAMS: "storagebox::ro"
    volumes:
      - type: bind
        source: "${QNAP_CATALOG_CACHE_DIR:?Set QNAP_CATALOG_CACHE_DIR to an absolute path under /share}"
        target: /data/library
      - type: bind
        source: "${QNAP_CATALOG_STATE_DIR:?Set QNAP_CATALOG_STATE_DIR to an absolute path under /share}"
        target: /data/state
      - type: bind
        source: "${QNAP_STORAGEBOX_KEY_FILE:?Set QNAP_STORAGEBOX_KEY_FILE to the dedicated private key's absolute path}"
        target: /run/secrets/storagebox_key
        read_only: true
      - type: bind
        source: "${QNAP_STORAGEBOX_KNOWN_HOSTS_FILE:?Set QNAP_STORAGEBOX_KNOWN_HOSTS_FILE to the verified known_hosts file's absolute path}"
        target: /run/secrets/storagebox_known_hosts
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - rclone
        - version
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s

  catalog:
    profiles:
      - tools
    build:
      context: .
      dockerfile: Dockerfile.catalog
    image: usenet-catalog-tools:rclone-1.75.1-python-3.14.7
    user: "${QNAP_UID:?Set QNAP_UID to the dedicated NAS user's numeric UID}:${QNAP_GID:?Set QNAP_GID to the dedicated NAS user's numeric GID}"
    working_dir: /data
    read_only: true
    init: true
    restart: "no"
    environment:
      HOME: /tmp/catalog-home
      TZ: "${TZ:-UTC}"
      XDG_CACHE_HOME: /tmp/rclone-cache
      XDG_CONFIG_HOME: /tmp/rclone-config
      PYTHONDONTWRITEBYTECODE: "1"

      # Catalog scripts must address this client-side read-only union, not the
      # underlying storagebox remote.
      CATALOG_ROLE: qnap
      CATALOG_REMOTE: "catalog:"
      CATALOG_LOCAL_ROOT: /data/library
      CATALOG_STATE_ROOT: /data/state
      # Staging shares the cache bind so the final os.replace is atomic.
      CATALOG_STAGING_ROOT: /data/library/.staging
      CATALOG_MIN_FREE_BYTES: "${CATALOG_MIN_FREE_BYTES:-10737418240}"
      RCLONE_BIN: /usr/local/bin/rclone
      RCLONE_TRANSFERS: "${RCLONE_TRANSFERS:-2}"
      RCLONE_CHECKERS: "${RCLONE_CHECKERS:-4}"
      STORAGE_WARN_FRACTION: "${STORAGE_WARN_FRACTION:-0.80}"

      RCLONE_CONFIG_STORAGEBOX_TYPE: sftp
      RCLONE_CONFIG_STORAGEBOX_HOST: "${STORAGEBOX_HOST:?Set STORAGEBOX_HOST to the subaccount hostname}"
      RCLONE_CONFIG_STORAGEBOX_USER: "${STORAGEBOX_USER:?Set STORAGEBOX_USER to the read-only subaccount username}"
      RCLONE_CONFIG_STORAGEBOX_PORT: "${STORAGEBOX_PORT:-23}"
      RCLONE_CONFIG_STORAGEBOX_KEY_FILE: /run/secrets/storagebox_key
      RCLONE_CONFIG_STORAGEBOX_KNOWN_HOSTS_FILE: /run/secrets/storagebox_known_hosts
      RCLONE_CONFIG_STORAGEBOX_SHELL_TYPE: "${STORAGEBOX_SHELL_TYPE:-unix}"
      RCLONE_CONFIG_STORAGEBOX_HASHES: "${STORAGEBOX_HASHES:-sha256}"
      RCLONE_CONFIG_STORAGEBOX_SHA256SUM_COMMAND: "${STORAGEBOX_SHA256SUM_COMMAND:-sha256sum}"
      RCLONE_CONFIG_STORAGEBOX_SKIP_LINKS: "true"
      RCLONE_CONFIG_STORAGEBOX_CHUNK_SIZE: "${RCLONE_SFTP_CHUNK_SIZE:-32Ki}"
      RCLONE_CONFIG_STORAGEBOX_CONCURRENCY: "${RCLONE_SFTP_CONCURRENCY:-64}"

      RCLONE_CONFIG_CATALOG_TYPE: union
      RCLONE_CONFIG_CATALOG_UPSTREAMS: "storagebox::ro"
    volumes:
      - type: bind
        source: "${QNAP_CATALOG_SCRIPTS_DIR:?Set QNAP_CATALOG_SCRIPTS_DIR to the repository scripts directory under /share}"
        target: /opt/usenet/scripts
        read_only: true
      - type: bind
        source: "${QNAP_CATALOG_CACHE_DIR:?Set QNAP_CATALOG_CACHE_DIR to an absolute path under /share}"
        target: /data/library
      - type: bind
        source: "${QNAP_CATALOG_STATE_DIR:?Set QNAP_CATALOG_STATE_DIR to an absolute path under /share}"
        target: /data/state
      - type: bind
        source: "${QNAP_STORAGEBOX_KEY_FILE:?Set QNAP_STORAGEBOX_KEY_FILE to the dedicated private key's absolute path}"
        target: /run/secrets/storagebox_key
        read_only: true
      - type: bind
        source: "${QNAP_STORAGEBOX_KNOWN_HOSTS_FILE:?Set QNAP_STORAGEBOX_KNOWN_HOSTS_FILE to the verified known_hosts file's absolute path}"
        target: /run/secrets/storagebox_known_hosts
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
