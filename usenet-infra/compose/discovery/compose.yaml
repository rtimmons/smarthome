name: usenet-discovery

services:
  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4.10685-ls318
    environment:
      PUID: "${PUID:?Set PUID}"
      PGID: "${PGID:?Set PGID}"
      TZ: "${TZ:?Set TZ}"
      UMASK: "0077"
      ARR_LIBRARY_KIND: Movies
    volumes:
      - /srv/usenet/config/radarr:/config
      - /srv/usenet/libexec/arr-shared-library-init:/custom-cont-init.d/10-shared-library:ro
      - /srv/usenet/library:/storage
      - /srv/usenet/downloads/complete:/data/complete
    ports:
      - "127.0.0.1:7878:7878"
    networks: [cloud]
    restart: "no"
    healthcheck:
      test: [CMD, curl, -fsS, "http://127.0.0.1:7878/radarr/ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls325
    environment:
      PUID: "${PUID:?Set PUID}"
      PGID: "${PGID:?Set PGID}"
      TZ: "${TZ:?Set TZ}"
      UMASK: "0077"
      ARR_LIBRARY_KIND: TV
    volumes:
      - /srv/usenet/config/sonarr:/config
      - /srv/usenet/libexec/arr-shared-library-init:/custom-cont-init.d/10-shared-library:ro
      - /srv/usenet/library:/storage
      - /srv/usenet/downloads/complete:/data/complete
    ports:
      - "127.0.0.1:8989:8989"
    networks: [cloud]
    restart: "no"
    healthcheck:
      test: [CMD, curl, -fsS, "http://127.0.0.1:8989/sonarr/ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

networks:
  cloud:
    external: true
    name: usenet-cloud_default
