# Settings only: no searches, renames of existing files or quality reordering.
# Reject AV1 for clients that cannot direct play it; retain H.264 and HEVC.
# Unspecified settings are retained; no broad guide templates are imported.
radarr:
  seerr_movies:
    # Household capacity ceilings; retain existing minima and tighter limits.
    quality_definition:
      type: movie
      qualities:
        - {"name": "HDTV-720p", "min": 0, "preferred": 95, "max": 100}
        - {"name": "WEBDL-720p", "min": 0, "preferred": 95, "max": 100}
        - {"name": "WEBRip-720p", "min": 0, "preferred": 95, "max": 100}
        - {"name": "Bluray-720p", "min": 0, "preferred": 95, "max": 100}
        - {"name": "HDTV-1080p", "min": 0, "preferred": 95, "max": 100}
        - {"name": "WEBDL-1080p", "min": 0, "preferred": 95, "max": 100}
        - {"name": "WEBRip-1080p", "min": 0, "preferred": 95, "max": 100}
        - {"name": "Bluray-1080p", "min": 0, "preferred": 190.0, "max": 200}
        - {"name": "Remux-1080p", "min": 0, "preferred": 380.0, "max": 400}
        - {"name": "HDTV-2160p", "min": 0, "preferred": 380.0, "max": 400}
        - {"name": "WEBDL-2160p", "min": 0, "preferred": 380.0, "max": 400}
        - {"name": "WEBRip-2160p", "min": 0, "preferred": 380.0, "max": 400}
        - {"name": "Bluray-2160p", "min": 0, "preferred": 380.0, "max": 400}
        - {"name": "Remux-2160p", "min": 0, "preferred": 760.0, "max": 800}
    base_url: http://127.0.0.1:7878/radarr
    api_key: !secret radarr_api_key
    media_management:
      propers_and_repacks: do_not_prefer
    media_naming:
      movie:
        rename: true
    quality_profiles: &no_upgrades
      - name: Any
        min_format_score: 0
        upgrade: {allowed: false}
      - name: SD
        min_format_score: 0
        upgrade: {allowed: false}
      - name: HD-720p
        min_format_score: 0
        upgrade: {allowed: false}
      - name: HD-1080p
        min_format_score: 0
        upgrade: {allowed: false}
      - name: Ultra-HD
        min_format_score: 0
        upgrade: {allowed: false}
      - name: HD - 720p/1080p
        min_format_score: 0
        upgrade: {allowed: false}
    custom_formats:
      - trash_ids: [cae4ca30163749b891686f95532519bd] # AV1
        assign_scores_to: &reject_av1
          - {name: Any, score: -10000}
          - {name: SD, score: -10000}
          - {name: HD-720p, score: -10000}
          - {name: HD-1080p, score: -10000}
          - {name: Ultra-HD, score: -10000}
          - {name: HD - 720p/1080p, score: -10000}
sonarr:
  seerr_tv:
    # Household capacity ceilings; retain existing minima and tighter limits.
    quality_definition:
      type: series
      qualities:
        - {"name": "HDTV-720p", "min": 3, "preferred": 95, "max": 125}
        - {"name": "HDTV-1080p", "min": 4, "preferred": 95, "max": 125}
        - {"name": "WEBRip-720p", "min": 3, "preferred": 95, "max": 130}
        - {"name": "WEBDL-720p", "min": 3, "preferred": 95, "max": 130}
        - {"name": "Bluray-720p", "min": 4, "preferred": 95, "max": 130}
        - {"name": "WEBRip-1080p", "min": 4, "preferred": 95, "max": 130}
        - {"name": "WEBDL-1080p", "min": 4, "preferred": 95, "max": 130}
        - {"name": "Bluray-1080p", "min": 4, "preferred": 95, "max": 155}
        - {"name": "Bluray-1080p Remux", "min": 35, "preferred": 95, "max": 400}
        - {"name": "HDTV-2160p", "min": 35, "preferred": 95, "max": 199.9}
        - {"name": "WEBRip-2160p", "min": 35, "preferred": 95, "max": 400}
        - {"name": "WEBDL-2160p", "min": 35, "preferred": 95, "max": 400}
        - {"name": "Bluray-2160p", "min": 35, "preferred": 95, "max": 400}
        - {"name": "Bluray-2160p Remux", "min": 35, "preferred": 95, "max": 800}
    base_url: http://127.0.0.1:8989/sonarr
    api_key: !secret sonarr_api_key
    media_management:
      propers_and_repacks: do_not_prefer
    media_naming:
      episodes:
        rename: true
    quality_profiles: *no_upgrades
    custom_formats:
      - trash_ids: [15a05bc7c1a36e2b57fd628f8977e2fc] # AV1
        assign_scores_to: *reject_av1
