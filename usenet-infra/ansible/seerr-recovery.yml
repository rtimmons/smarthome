---
- name: Install request-scoped report-only recovery and private HA notifications
  hosts: cloud
  become: true
  gather_facts: false
  tasks:
    - name: Verify native ownership without changing acquisition settings
      ansible.builtin.command:
        argv: [sudo, -n, -u, usenet, python3, /srv/usenet/libexec/native-cutover.py, inspect]
      changed_when: false

    - name: Read private notification configuration
      ansible.builtin.set_fact:
        recovery_notify: "{{ lookup('ansible.builtin.file', usenet_project_root + '/secrets/seerr-recovery/notify.json') | from_json }}"
      no_log: true

    - name: Create private report directory covered by catalog configuration backups
      ansible.builtin.file:
        path: /srv/usenet/config/catalog/seerr-recovery
        state: directory
        owner: usenet
        group: usenet
        mode: '0700'

    - name: Install report-only reader
      ansible.builtin.copy:
        src: '{{ usenet_project_root }}/scripts/seerr-recovery.py'
        dest: /srv/usenet/libexec/seerr-recovery.py
        owner: root
        group: usenet
        mode: '0550'

    - name: Install only the narrow notification credential
      ansible.builtin.copy:
        content: '{{ recovery_notify | to_json }}'
        dest: /srv/usenet/config/catalog/seerr-recovery/notify.json
        owner: usenet
        group: usenet
        mode: '0600'
      no_log: true

    - name: Install reviewed exact-host VPN firewall extension
      ansible.builtin.copy:
        src: '{{ usenet_project_root }}/ansible/roles/cloud_vpn/files/vpn-network.py'
        dest: /usr/local/libexec/usenet-vpn/vpn-network.py
        owner: root
        group: root
        mode: '0750'

    - name: Allow only HA webhook transport inside the existing VPN
      ansible.builtin.command:
        argv: [python3, /usr/local/libexec/usenet-vpn/vpn-network.py, recovery-enable,
               /etc/usenet-vpn/network.json, --nas-ip, '{{ recovery_notify.host }}']
      changed_when: true

    - name: Install recovery units
      ansible.builtin.copy:
        src: '{{ usenet_project_root }}/config/{{ item }}'
        dest: '/etc/systemd/system/{{ item }}'
        owner: root
        group: root
        mode: '0644'
      loop: [usenet-seerr-recovery.service, usenet-seerr-recovery.timer]

    - name: Run the report-only check before enabling its timer
      ansible.builtin.systemd_service:
        daemon_reload: true
        name: usenet-seerr-recovery.service
        state: started

    - name: Enable five-minute reporting
      ansible.builtin.systemd_service:
        name: usenet-seerr-recovery.timer
        enabled: true
        state: started

    - name: Read sanitized report status
      ansible.builtin.command:
        argv: [sudo, -n, -u, usenet, python3, /srv/usenet/libexec/seerr-recovery.py, status]
      changed_when: false
