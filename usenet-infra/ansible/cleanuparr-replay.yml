---
- name: Exercise pinned Cleanuparr with offline Seerr repair snapshots only
  hosts: cloud
  become: true
  gather_facts: false
  tasks:
    - name: Preserve a prior stopped lab before starting a fresh trial
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - "from pathlib import Path; import datetime; p=Path('/srv/usenet/config/catalog/cleanuparr-replay'); marker=p/'data/credentials.json'; marker.exists() and p.rename(p.with_name(p.name+'-'+datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%dT%H%M%S.%fZ')))"
      changed_when: true
    - name: Create private disposable lab directories
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        owner: usenet
        group: usenet
        mode: '0700'
      loop:
        - /srv/usenet/compose/cleanuparr-replay
        - /srv/usenet/config/catalog/cleanuparr-replay
        - /srv/usenet/config/catalog/cleanuparr-replay/data
        - /srv/usenet/config/catalog/cleanuparr-replay/config
    - name: Install offline fixture runner
      ansible.builtin.copy:
        src: '{{ usenet_project_root }}/tests/cleanuparr_replay.py'
        dest: /srv/usenet/libexec/cleanuparr_replay.py
        owner: root
        group: usenet
        mode: '0550'
    - name: Install isolated pinned Compose
      ansible.builtin.copy:
        src: '{{ usenet_project_root }}/compose/cleanuparr-replay/compose.yaml'
        dest: /srv/usenet/compose/cleanuparr-replay/compose.yaml
        owner: usenet
        group: usenet
        mode: '0600'
    - name: Use existing service account identity
      ansible.builtin.copy:
        src: /srv/usenet/compose/recyclarr/.env
        remote_src: true
        dest: /srv/usenet/compose/cleanuparr-replay/.env
        owner: usenet
        group: usenet
        mode: '0600'
    - name: Export only saved approved request fixtures without credentials
      ansible.builtin.command:
        argv: [sudo, -n, -u, usenet, python3, /srv/usenet/libexec/cleanuparr_replay.py, export, /srv/usenet/config/catalog/cleanuparr-replay/data]
      changed_when: true
    - name: Run isolated compatibility trial
      block:
        - name: Start offline fixtures and Cleanuparr without host ports
          ansible.builtin.command:
            cmd: docker compose up -d
            chdir: /srv/usenet/compose/cleanuparr-replay
          changed_when: true
        - name: Exercise dry-run cases and preserve private receipts
          ansible.builtin.command:
            cmd: docker compose exec -T fixtures python3 /test/cleanuparr_replay.py run
            chdir: /srv/usenet/compose/cleanuparr-replay
          changed_when: false
        - name: Verify actual isolation and mounts
          ansible.builtin.command:
            argv: [python3, /srv/usenet/libexec/cleanuparr_replay.py, topology]
          changed_when: false
      always:
        - name: Preserve private test log
          ansible.builtin.shell:
            cmd: 'umask 077; docker compose logs --no-color > /srv/usenet/config/catalog/cleanuparr-replay/log.txt'
            chdir: /srv/usenet/compose/cleanuparr-replay
          changed_when: false
        - name: Remove offline containers and network but preserve evidence
          ansible.builtin.command:
            cmd: docker compose down
            chdir: /srv/usenet/compose/cleanuparr-replay
          changed_when: true
    - name: Check expected positive and negative outcomes against actual logs
      ansible.builtin.command:
        argv: [python3, /srv/usenet/libexec/cleanuparr_replay.py, verify]
      changed_when: false
