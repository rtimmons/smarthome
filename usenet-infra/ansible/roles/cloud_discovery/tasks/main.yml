---
- name: Provide the native library mount first
  ansible.builtin.include_role:
    name: cloud_library

- name: Require the existing private access path
  ansible.builtin.assert:
    that:
      - cloud_lan_ui_enabled | bool
      - cloud_vpn_service_ip == '10.77.0.1'

- name: Create discovery configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: usenet
    group: usenet
    mode: "0750"
  loop:
    - /srv/usenet/config/radarr
    - /srv/usenet/config/sonarr
    - /srv/usenet/compose/discovery

- name: Install discovery helpers
  tags: [discovery-config]
  ansible.builtin.copy:
    src: "{{ usenet_project_root }}/scripts/{{ item }}"
    dest: "/srv/usenet/libexec/{{ item }}"
    owner: root
    group: usenet
    mode: "0550"
  loop: [discovery-init.py, discovery-config.py]

- name: Initialize only missing application identity files
  ansible.builtin.command:
    argv: [python3, /srv/usenet/libexec/discovery-init.py]
  become_user: usenet
  changed_when: false
  no_log: true

- name: Install the pinned discovery Compose project
  ansible.builtin.copy:
    src: "{{ usenet_project_root }}/compose/discovery/compose.yaml"
    dest: /srv/usenet/compose/discovery/compose.yaml
    owner: usenet
    group: usenet
    mode: "0640"

- name: Render discovery runtime identity
  ansible.builtin.copy:
    content: |
      PUID={{ usenet_uid }}
      PGID={{ usenet_gid }}
      TZ={{ usenet_timezone }}
    dest: /srv/usenet/compose/discovery/.env
    owner: usenet
    group: usenet
    mode: "0600"

- name: Install mount-dependent discovery service
  ansible.builtin.copy:
    src: '{{ usenet_project_root }}/config/usenet-discovery.service'
    dest: /etc/systemd/system/usenet-discovery.service
    owner: root
    group: root
    mode: '0644'

- name: Start mount-dependent discovery applications
  ansible.builtin.systemd_service:
    name: usenet-discovery.service
    daemon_reload: true
    enabled: true
    state: restarted

- name: Apply and read back discovery controls before exposing the UI
  tags: [discovery-config]
  ansible.builtin.command:
    argv: [python3, /srv/usenet/libexec/discovery-config.py, configure]
  become_user: usenet
  register: discovery_configuration
  changed_when: "'\"changed\": true' in discovery_configuration.stdout"
