---
- name: Install host-owned cloud backup scheduler
  ansible.builtin.copy:
    src: "{{ usenet_project_root }}/scripts/{{ item }}"
    dest: "{{ cloud_data_root }}/libexec/{{ item }}"
    owner: root
    group: usenet
    mode: '0550'
  loop: [scheduled-backup.py, config-backup.py, catalogctl.py]

- name: Install daily backup service and hourly retry timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop: [usenet-backup.service, usenet-backup.timer]

- name: Enable cloud configuration backups
  ansible.builtin.systemd_service:
    name: usenet-backup.timer
    daemon_reload: true
    enabled: true
    state: started
