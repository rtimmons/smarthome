---
- name: Require the reviewed cloud architecture and dedicated public recipient
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] == 'x86_64'
      - cloud_admin_authorized_key_source | length > 0
      - lookup('ansible.builtin.file', cloud_admin_authorized_key_source) is match('^ssh-ed25519 ')
    fail_msg: "Backup deployment requires the dedicated Ed25519 administrator public key and reviewed amd64 age binary."

- name: Create the private encrypted backup directory
  ansible.builtin.file:
    path: "{{ cloud_data_root }}/backups"
    state: directory
    owner: usenet
    group: usenet
    mode: "0700"

- name: Install the verified pinned age executable
  ansible.builtin.copy:
    src: "{{ usenet_project_root }}/../build/tools/age-1.3.2/linux-amd64/age"
    dest: "{{ cloud_data_root }}/libexec/age"
    owner: root
    group: usenet
    mode: "0550"

- name: Verify the installed encryption version
  ansible.builtin.command:
    argv:
      - "{{ cloud_data_root }}/libexec/age"
      - --version
  register: backup_age_version
  changed_when: false
  failed_when: backup_age_version.stdout | trim not in ['1.3.2', 'v1.3.2']

- name: Install the configuration backup helper
  ansible.builtin.copy:
    src: "{{ usenet_project_root }}/scripts/config-backup.py"
    dest: "{{ cloud_data_root }}/libexec/config-backup.py"
    owner: root
    group: usenet
    mode: "0550"

- name: Install only the administrator public encryption recipient
  ansible.builtin.copy:
    src: "{{ cloud_admin_authorized_key_source }}"
    dest: "{{ cloud_data_root }}/config/backup-recipient.pub"
    owner: root
    group: usenet
    mode: "0640"
