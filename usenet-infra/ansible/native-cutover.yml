---
- name: Refresh native ownership inspection without replaying a migration
  hosts: cloud
  become: true
  gather_facts: false
  tasks:
    - name: Require restored native configuration
      ansible.builtin.stat:
        path: /srv/usenet/config/catalog/native-ownership.json
      register: native_marker

    - name: Refuse an unconfigured or legacy installation
      ansible.builtin.assert:
        that: native_marker.stat.isreg | default(false)
        fail_msg: 'Restore the accepted native configuration before refreshing helpers.'

    - name: Require idle post-processing before installing changed policy
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - >-
            import sys; sys.path.insert(0, '/srv/usenet/libexec');
            from cart_import_sab import SabSource;
            h = SabSource().api('history', start=0, limit=1, archive=0)['history'];
            sys.exit(0 if str(h.get('ppslots')) == '0' else 'post_processing_active_retry_when_idle')
      become_user: usenet
      when: native_configure_processing | default(false) | bool
      changed_when: false

    - name: Install current native health helpers
      ansible.builtin.copy:
        src: '{{ usenet_project_root }}/scripts/{{ item }}.py'
        dest: '/srv/usenet/libexec/{{ item }}.py'
        owner: root
        group: usenet
        mode: '0550'
      loop: [native-cutover, cart_import_sab, discovery-config, healthcheck, catalogctl]

    - name: Apply explicitly requested processing tuning between jobs
      ansible.builtin.command:
        argv: [python3, /srv/usenet/libexec/native-cutover.py, configure-processing]
      become_user: usenet
      when: native_configure_processing | default(false) | bool
      register: processing_tuning
      changed_when: (processing_tuning.stdout | from_json).changed

    - name: Enable explicitly requested automatic failed-release replacement
      ansible.builtin.command:
        argv: [python3, /srv/usenet/libexec/discovery-config.py, configure-failed-downloads]
      become_user: usenet
      when: native_configure_failed_downloads | default(false) | bool
      register: failed_download_policy
      changed_when: (failed_download_policy.stdout | from_json).changed

    - name: Enable explicitly requested native failed-download cleanup
      ansible.builtin.command:
        argv: [python3, /srv/usenet/libexec/discovery-config.py, configure-failed-cleanup]
      become_user: usenet
      when: native_configure_failed_cleanup | default(false) | bool
      register: failed_cleanup_policy
      changed_when: (failed_cleanup_policy.stdout | from_json).changed

    - name: Enable explicitly requested native RSS acquisition
      ansible.builtin.command:
        argv: [python3, /srv/usenet/libexec/discovery-config.py, configure-rss]
      become_user: usenet
      when: native_configure_rss | default(false) | bool
      register: rss_policy
      changed_when: (rss_policy.stdout | from_json).changed

    - name: Verify native owners, retired timers and preserved history
      ansible.builtin.command:
        argv: [python3, /srv/usenet/libexec/native-cutover.py, inspect]
      become_user: usenet
      changed_when: false
