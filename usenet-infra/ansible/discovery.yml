---
- name: Configure the explicitly selected discovery applications
  hosts: cloud
  become: true
  gather_facts: true
  pre_tasks:
    - name: Read restored native ownership before changing applications
      ansible.builtin.slurp:
        src: /srv/usenet/config/catalog/native-ownership.json
      register: discovery_native_marker

    - name: Require the accepted native policy
      ansible.builtin.assert:
        that:
          - (discovery_native_marker.content | b64decode | from_json).phase == 'active'
          - (discovery_native_marker.content | b64decode | from_json).integrity_policy == 'native_arr_import_and_cleanup'
  roles:
    - role: cloud_discovery
    - role: cloud_backup
    - role: cloud_ui_proxy
