name: home-dns
services:
  resolver:
    image: home-dns:adguard-0.107.79-nonroot
    build: .
    user: "${DNS_UID:?}:${DNS_GID:?}"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "192.168.1.66:53:1053/udp"
      - "192.168.1.66:53:1053/tcp"
      - "127.0.0.1:3001:3000/tcp"
    volumes:
      - "${DNS_ROOT:?}/config:/opt/adguardhome/conf"
      - "${DNS_ROOT:?}/data:/opt/adguardhome/work"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: [CMD-SHELL, "nslookup wiki.home.arpa 127.0.0.1:1053 | grep -q 192.168.1.66"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: local
      options: {max-size: 1m, max-file: "2"}
