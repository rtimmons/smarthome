name: Wiki validation
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  wiki:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - name: Install recipe runner
        run: sudo apt-get update && sudo apt-get install -y just
      - name: Install pinned runtimes and model dependencies
        run: |
          uv python install "$(cat .python-version)"
          source talos/scripts/nvm_use.sh
          npm --prefix new-hass-configs/config-generator ci
      - name: Validate documentation without household credentials
        run: just wiki-check
