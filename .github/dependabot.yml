version: 2

updates:
  - package-ecosystem: npm
    directories:
      - /grid-dashboard/ExpressServer
      - /new-hass-configs/config-generator
      - /node-sonos-http-api/dependency-lock
      - /snapshot-service
      - /sonos-api
      - /tinyurl-service
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: uv
    directories:
      - /printer
      - /talos
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: docker
    directories:
      - /ha-local-addon-kit/templates/ha-addon
      - /mongodb
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: deps
      include: scope
